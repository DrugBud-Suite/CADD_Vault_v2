name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (build + lint + test + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cadd-vault-frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: cadd-vault-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check + build
        run: npm run build

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: cadd-vault-frontend/coverage
          if-no-files-found: ignore
          retention-days: 14

  backend:
    name: Backend (unit tests + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cadd-vault-backend-scripts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: cadd-vault-backend-scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests with coverage
        # pytest.ini deselects integration/api/slow markers by default,
        # so CI runs only the offline-safe unit suite.
        run: pytest --cov=. --cov-report=term --cov-report=xml

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: cadd-vault-backend-scripts/coverage.xml
          if-no-files-found: ignore
          retention-days: 14
